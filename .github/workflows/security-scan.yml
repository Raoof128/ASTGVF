name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly security scans
    - cron: '0 0 * * 0'

jobs:
  dependency-scan:
    runs-on: ubuntu-latest
    name: Dependency Security Scan

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit

    - name: Run Safety (Dependency Vulnerability Scanner)
      run: |
        safety check --json || true

    - name: Run Bandit (Code Security Scanner)
      run: |
        bandit -r . -f json -o bandit-report.json || true

    - name: Upload Bandit Report
      uses: actions/upload-artifact@v3
      with:
        name: bandit-security-report
        path: bandit-report.json

  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality Check

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install black flake8 mypy pylint

    - name: Run Black (Code Formatter Check)
      run: black --check --diff .

    - name: Run Flake8 (Linter)
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run MyPy (Type Checker)
      run: mypy core/ detectors/ reporting/ orchestration/ --ignore-missing-imports || true

    - name: Run Pylint (Code Analysis)
      run: pylint core/ detectors/ reporting/ orchestration/ --exit-zero

  secret-scan:
    runs-on: ubuntu-latest
    name: Secret Scanning

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: TruffleHog Secret Scanner
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ${{ github.event.repository.default_branch }}
        head: HEAD
